name: Duplicate host IP check

on: [push, pull_request]

jobs:
  check-duplicate-hosts:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: Check for duplicate ansible_host addresses
        run: python scripts/duplicate_hosts.py
